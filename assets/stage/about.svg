<radialGradient id="g2" cx="0%" cy="100%" r="60%"><stop offset="0" stop-color="#6366f1" stop-opacity=".22"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/></radialGradient>
<linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#e11d48"/><stop offset="1" stop-color="#fb7185"/></linearGradient>
</defs><rect width="900" height="182" rx="14" fill="#05060f"/><rect x="0" y="0" width="6" height="182" fill="url(#bar)"/><text x="40" y="42" font-size="12" fill="#fb7185" letter-spacing="3">// ABOUT</text><g class="in"><text class="s" x="40" y="78" font-size="17" fill="#ededed">I run CodeLovers, a small web agency in Morocco. 7+ years shipping enterprise web and</text><text class="s" x="40" y="106" font-size="17" fill="#ededed">mobile apps, multi-tenant SaaS and IoT systems, from MVP to production. I care about</text><text class="s" x="40" y="134" font-size="17" fill="#ededed">boring-reliable infrastructure, honest tenant isolation and software that operators</text><text class="s" x="40" y="162" font-size="17" fill="#ededed">actually trust.</text></g><rect x=".5" y=".5" width="899" height="181" rx="14" fill="none" stroke="#1e2236"/></svg>