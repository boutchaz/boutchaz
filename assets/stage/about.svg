<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 182" width="900" height="182" role="img" aria-label="I run CodeLovers, a small web agency in Morocco. 7+ years shipping enterprise web and mobile apps, multi-tenant SaaS and IoT systems, from MVP to production. I care about boring-reliable infrastructure, honest tenant isolation and software that operators actually trust."><title>I run CodeLovers, a small web agency in Morocco. 7+ years shipping enterprise web and mobile apps, multi-tenant SaaS and IoT systems, from MVP to production. I care about boring-reliable infrastructure, honest tenant isolation and software that operators actually trust.</title><style>
text{font-family:ui-monospace,'Geist Mono',SFMono-Regular,Menlo,Consolas,monospace}
.s{font-family:'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}
.in{animation:in .6s ease-out both}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.blink{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.glow{animation:glow 4s ease-in-out infinite alternate}
@keyframes glow{from{opacity:.55}to{opacity:1}}
.mq{animation:mq 28s linear infinite}
@keyframes mq{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1e2236" stroke-width="1" opacity=".55"/></pattern>
